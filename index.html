<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeriWave</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="app-header">
        <h1>VeriWave</h1>
        <div class="header-controls">
            <label for="time-unit">Unit</label>
            <select id="time-unit">
                <option value="ns">ns</option>
                <option value="us">us</option>
                <option value="ms">ms</option>
            </select>
            <label for="time-steps">Steps</label>
            <input type="number" id="time-steps" value="50" min="10" max="200" step="10">
        </div>
        <a id="github-link" href="https://github.com/ya-uhs/VeriWave.github.io" target="_blank" rel="noopener" title="GitHub">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2 0-.4-.5-1.6.2-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17 4.7 18 5 18 5c.7 1.6.2 2.8.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/>
            </svg>
        </a>
        <button id="theme-switcher" title="テーマ切り替え">🎨</button>
    </header>

    <div id="app-body">
        <aside id="sidebar">
            <div class="sidebar-header">
                <span>Signals</span>
                <button id="add-signal-btn">+ Add</button>
            </div>
            <div id="signal-list"></div>
        </aside>

        <div id="wave-panel">
            <div class="waves-container">
                <canvas id="timing-chart-canvas"></canvas>
                <canvas id="time-axis-canvas"></canvas>
            </div>

            <div id="output-panel">
                <div class="output-toolbar">
                    <button id="wavedrom-btn" class="btn-generate">&#9654; WaveDrom</button>
                    <button id="sv-testbench-btn" class="btn-generate sv">&#9654; SV Testbench</button>
                </div>
                <div class="output-areas">
                    <div class="output-box">
                        <div class="output-box-header">
                            <span>WaveDrom JSON</span>
                            <button id="copy-wavedrom-btn" class="btn-copy">Copy</button>
                        </div>
                        <textarea id="wavedrom-output" readonly></textarea>
                    </div>
                    <div class="output-box">
                        <div class="output-box-header">
                            <span>SystemVerilog Testbench</span>
                            <button id="copy-sv-btn" class="btn-copy">Copy</button>
                        </div>
                        <textarea id="sv-testbench-output" readonly></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
