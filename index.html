<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeriWave</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="app-header">
        <h1>VeriWave</h1>
        <div class="header-controls">
            <label for="time-unit">Unit</label>
            <select id="time-unit">
                <option value="ns">ns</option>
                <option value="us">us</option>
                <option value="ms">ms</option>
            </select>
            <label for="time-steps">Steps</label>
            <input type="number" id="time-steps" value="50" min="10" max="200" step="10">
        </div>
        <button id="theme-switcher" title="テーマ切り替え">🎨</button>
    </header>

    <div id="app-body">
        <aside id="sidebar">
            <div class="sidebar-header">
                <span>Signals</span>
                <button id="add-signal-btn">+ Add</button>
            </div>
            <div id="signal-list"></div>
        </aside>

        <div id="wave-panel">
            <div class="waves-container">
                <canvas id="timing-chart-canvas"></canvas>
                <canvas id="time-axis-canvas"></canvas>
            </div>

            <div id="output-panel">
                <div class="output-toolbar">
                    <button id="wavedrom-btn" class="btn-generate">&#9654; WaveDrom</button>
                    <button id="sv-testbench-btn" class="btn-generate sv">&#9654; SV Testbench</button>
                </div>
                <div class="output-areas">
                    <div class="output-box">
                        <div class="output-box-header">
                            <span>WaveDrom JSON</span>
                            <button id="copy-wavedrom-btn" class="btn-copy">Copy</button>
                        </div>
                        <textarea id="wavedrom-output" readonly></textarea>
                    </div>
                    <div class="output-box">
                        <div class="output-box-header">
                            <span>SystemVerilog Testbench</span>
                            <button id="copy-sv-btn" class="btn-copy">Copy</button>
                        </div>
                        <textarea id="sv-testbench-output" readonly></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
